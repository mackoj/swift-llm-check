# swift-llm-check: what the rules in Architecture/ read. `Codebase()` finds the repository root here.
# A name matches any folder or file; a path with a slash matches from the root.
excludes:
  - Architecture
  - docs
  # A sample codebase for the library's own tests; it breaks rules on purpose.
  - Tests/LLMCheckTests/Fixtures
# Folders ending in Tests, and Fixtures, hold test code.
testSuffixes: [Tests]
testFolders: [Fixtures]
